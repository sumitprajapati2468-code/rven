# compose.yml

name: rveng

services:
  api:
    build:
      context: .
      dockerfile: infra/docker/api.dockerfile
    container_name: rveng-api
    environment:
      - CORSAIR_API_KEY=ck_dev_sec_9941a37c98f10b2d6a
      - CORSAIR_KEK=k3k_b64_9a8f27e10c55490ba8208f6d7c9281a4b5d6e7f8
      - CORSAIR_HUB_URL=https://hub.corsair.dev
      - CORSAIR_DOCS_URL=https://docs.corsair.dev/
      - CORSAIR_TENANT_ID=cybersecurity-lab
    expose:
      - "8000"
    volumes:
      - rveng_data:/app/data
    networks:
      - app
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: infra/docker/vite.prod
    container_name: rveng-nginx
    ports:
      - "${NGINX_HOST_PORT:-8790}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app
    restart: unless-stopped

networks:
  app:
    driver: bridge

volumes:
  rveng_data:
